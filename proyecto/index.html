<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consulta tablas LaTeX y sus referencias BibTeX.">
  <title>Atlas de tablas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="vendor/katex/katex.min.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="frame masthead-inner">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span>Atlas de tablas</span>
      </a>
      <button type="button" id="theme" class="theme-button" aria-pressed="false">
        <span id="theme-symbol" aria-hidden="true">☾</span> <span id="theme-text">Tema oscuro</span>
      </button>
    </div>
  </header>

  <main class="frame layout">
    <aside class="sidebar" aria-label="Explorar tablas">
      <h2>Explorar tablas</h2>
      <div class="filters">
        <label for="search">Buscar por texto</label>
        <input id="search" type="search" placeholder="Título o contenido" autocomplete="off">
        <label for="label-filter">Etiqueta</label>
        <select id="label-filter"><option value="">Todas las etiquetas</option></select>
        <label for="cite-filter">Clave bibliográfica</label>
        <select id="cite-filter"><option value="">Todas las claves</option></select>
        <button id="clear-filters" type="button" class="text-button" hidden>Limpiar filtros</button>
      </div>
      <p id="result-count" class="result-count" aria-live="polite"></p>
      <nav id="table-list" aria-label="Tablas disponibles"></nav>
    </aside>

    <section class="workspace" aria-label="Vista de tabla">
      <p id="load-status" class="notice" role="status">Cargando tablas…</p>
      <div id="table-view"></div>
      <div id="library-warnings" aria-live="polite"></div>
    </section>
  </main>

  <p id="feedback" role="status" class="toast" hidden></p>
  <dialog id="reference-dialog" aria-labelledby="reference-title">
    <div class="dialog-top">
      <p class="reference-key" id="reference-key"></p>
      <form method="dialog"><button type="submit" autofocus>Cerrar</button></form>
    </div>
    <h2 id="reference-title"></h2>
    <dl id="reference-fields"></dl>
    <div id="reference-links" class="external-links"></div>
    <details id="reference-raw"><summary>Entrada BibTeX</summary><pre id="reference-code"></pre></details>
  </dialog>
  <noscript><p class="frame notice">Activa JavaScript para consultar las tablas.</p></noscript>
  <script>
    if (location.protocol === "file:") {
      document.getElementById("load-status").textContent =
        "Abre el sitio por HTTP. En proyecto/, ejecuta python -m http.server y visita http://localhost:8000/.";
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
